name: Production readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check and production build
        run: pnpm verify

      - name: Verify Hostinger output
        run: |
          test -f dist/public/index.html
          test -f dist/public/.htaccess
          test -f dist/public/robots.txt
          test -f dist/public/sitemap.xml
          grep -q "https://thetyaclub.com/" dist/public/index.html
          grep -q "https://thetyaclub.com/franchise/" dist/public/sitemap.xml
