name: Deploy GitHub Pages with alternate UI preview

on:
  push:
    branches: [main, experiment/alternate-ui]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Build site
        run: pnpm build
        env:
          GITHUB_ACTIONS: true
          VITE_BASE_PATH: /tya-club-site/

      - name: Assemble production site
        run: |
          mkdir -p pages
          cp -R dist/public/. pages/
          cp pages/index.html pages/404.html

      - name: Checkout alternate UI branch
        uses: actions/checkout@v4
        with:
          ref: experiment/alternate-ui
          path: preview-source

      - name: Install preview dependencies
        working-directory: preview-source
        run: pnpm install --frozen-lockfile

      - name: Build alternate UI preview
        working-directory: preview-source
        run: pnpm build
        env:
          GITHUB_ACTIONS: true
          VITE_BASE_PATH: /tya-club-site/previews/alternate-ui/

      - name: Add alternate UI preview
        run: |
          mkdir -p pages/previews/alternate-ui
          cp -R preview-source/dist/public/. pages/previews/alternate-ui/
          cp pages/previews/alternate-ui/index.html pages/previews/alternate-ui/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
